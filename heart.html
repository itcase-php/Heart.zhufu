<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- <meta name="theme-color" content="#0c0818"> -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Blessing Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #e8b930;
      --rose: #e06070;
      --lavender: #c0a0ff;
      --sakura: #f0a0b0;
      --text: #f5f0e8;
      --text-muted: #9a9298;
      --card-surface: rgba(25, 18, 40, 0.92);
      --card-border: rgba(232, 185, 48, 0.18);
      --font-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: var(--font-body);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      position: relative;
      cursor: crosshair;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(100, 30, 60, 0.45) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 80%, rgba(30, 25, 80, 0.45) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(15, 10, 30, 0.9) 0%, transparent 80%),
        linear-gradient(150deg, #0c0818 0%, #1a1030 35%, #251525 65%, #180c1a 100%);
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 128 128' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      background-size: 256px 256px;
      pointer-events: none; z-index: 9999; opacity: 0.3;
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(1.8px 1.8px at 12% 22%, rgba(232,185,48,0.35) 50%, transparent 50%),
        radial-gradient(1.2px 1.2px at 33% 72%, rgba(232,185,48,0.2) 50%, transparent 50%),
        radial-gradient(1.5px 1.5px at 58% 28%, rgba(224,96,112,0.25) 50%, transparent 50%),
        radial-gradient(1px 1px at 78% 55%, rgba(192,160,255,0.25) 50%, transparent 50%),
        radial-gradient(2px 2px at 90% 12%, rgba(232,185,48,0.2) 50%, transparent 50%),
        radial-gradient(1.2px 1.2px at 45% 88%, rgba(232,185,48,0.15) 50%, transparent 50%),
        radial-gradient(1px 1px at 8% 60%, rgba(192,160,255,0.2) 50%, transparent 50%);
      pointer-events: none; z-index: 9998;
    }

    .header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 500;
      padding: 1.5rem 1.5rem 0.6rem;
      background: linear-gradient(to bottom, rgba(12,8,24,0.92) 0%, rgba(12,8,24,0.6) 60%, transparent 100%);
      text-align: center; pointer-events: none;
    }
    .header nav { pointer-events: auto; }

    .title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(1.6rem, 4.5vw, 2.4rem);
      letter-spacing: 0.03em;
      color: var(--text);
      opacity: 0; animation: fadeDown 0.7s ease forwards;
    }
    .title span { color: var(--gold); font-style: italic; }

    .subtitle {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: clamp(0.7rem, 1.8vw, 0.85rem);
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 0.15rem;
      opacity: 0; animation: fadeDown 0.7s ease 0.15s forwards;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .categories {
      display: flex; gap: 0.45rem;
      justify-content: center; flex-wrap: wrap;
      padding: 0.8rem 0 0;
      opacity: 0; animation: fadeDown 0.7s ease 0.3s forwards;
    }

    .pill {
      font-family: var(--font-body);
      font-size: clamp(0.6rem, 1.6vw, 0.72rem);
      font-weight: 500;
      padding: 0.38rem 0.95rem;
      border: 1px solid var(--card-border);
      border-radius: 100px;
      background: rgba(25,18,40,0.7);
      color: var(--text-muted);
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
    }
    .pill:hover, .pill:focus-visible {
      border-color: var(--gold);
      color: var(--text);
      background: rgba(232,185,48,0.08);
    }
    .pill:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .pill.active {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(232,185,48,0.12);
      box-shadow: 0 0 18px rgba(232,185,48,0.08);
    }

    .lang-sep {
      width: 1px; height: 1.1rem;
      background: rgba(255,255,255,0.1);
      align-self: center; margin: 0 0.15rem;
    }
    .pill.lang-pill { font-size: clamp(0.62rem, 1.6vw, 0.74rem); letter-spacing: 0.04em; }
    .pill.lang-pill.active[data-lang="ja"] {
      border-color: var(--sakura); color: var(--sakura);
      background: rgba(240,160,176,0.1); box-shadow: 0 0 14px rgba(240,160,176,0.06);
    }
    .pill.lang-pill.active:not([data-lang="ja"]) {
      border-color: var(--lavender); color: var(--lavender);
      background: rgba(192,160,255,0.1); box-shadow: 0 0 14px rgba(192,160,255,0.06);
    }

    .voice-badge {
      position: fixed; bottom: 2.8rem; left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-body);
      font-size: 0.58rem; color: var(--text-muted);
      letter-spacing: 0.04em; z-index: 500;
      opacity: 0; animation: fadeDown 0.7s ease 0.9s forwards;
      text-align: center; white-space: nowrap;
      padding: 0.25rem 0.7rem;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 100px;
      background: rgba(12,8,24,0.5);
      max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
    }
    .voice-badge .v-dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; margin-right: 0.3rem; vertical-align: middle;
    }
    .voice-badge .v-dot.ok   { background: #50c878; }
    .voice-badge .v-dot.warn { background: var(--gold); }

    .prompt {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; z-index: 10;
      pointer-events: none;
      opacity: 0; animation: promptIn 1s ease 0.8s forwards;
    }
    .prompt-icon {
      font-size: 2.8rem; color: var(--gold);
      opacity: 0.5;
      animation: gentleFloat 3.5s ease-in-out infinite;
      line-height: 1;
    }
    .prompt-text {
      font-family: var(--font-display);
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      font-weight: 400; font-style: italic;
      color: var(--text-muted);
      margin-top: 0.6rem; letter-spacing: 0.02em;
    }
    @keyframes promptIn { to { opacity: 1; } }
    @keyframes gentleFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .prompt.hidden { opacity: 0 !important; transition: opacity 0.5s ease; pointer-events: none; }

    .blessing {
      position: fixed; z-index: 300;
      max-width: min(380px, 86vw);
      padding: 1.2rem 1.4rem 1rem;
      background: var(--card-surface);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
      pointer-events: auto;
      opacity: 0; transform: translateY(14px) scale(0.93);
      animation: cardIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
      .blessing {
        background: linear-gradient(135deg, rgba(255,245,230,0.09) 0%, rgba(232,185,48,0.05) 100%);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
      }
    }
    .blessing.exiting {
      animation: cardOut 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      pointer-events: none;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(14px) scale(0.93)} to{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes cardOut { from{opacity:1;transform:translateY(0) scale(1);filter:blur(0)} to{opacity:0;transform:translateY(-18px) scale(0.96);filter:blur(2px)} }

    .blessing-cat {
      font-family: var(--font-body);
      font-size: 0.6rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--gold); margin-bottom: 0.55rem;
      display: flex; align-items: center; gap: 0.35rem;
    }
    .blessing-cat::before { content: '\2726'; font-size: 0.5rem; }

    .blessing-text {
      font-family: var(--font-display);
      font-size: clamp(1rem, 2.6vw, 1.18rem);
      font-weight: 400; line-height: 1.55; color: var(--text);
    }

    .blessing-actions {
      display: flex; justify-content: flex-end; gap: 0.45rem;
      margin-top: 0.85rem; flex-wrap: wrap;
    }

    .btn-speak, .btn-dismiss, .btn-record, .btn-rerecord {
      font-family: var(--font-body);
      font-size: 0.65rem; font-weight: 500;
      padding: 0.3rem 0.8rem;
      border: 1px solid transparent;
      border-radius: 100px;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
      display: flex; align-items: center; gap: 0.3rem;
    }

    .btn-speak {
      border-color: rgba(232,185,48,0.3);
      background: rgba(232,185,48,0.08);
      color: var(--gold);
    }
    .btn-speak:hover, .btn-speak:focus-visible {
      background: rgba(232,185,48,0.18); border-color: var(--gold);
      box-shadow: 0 0 14px rgba(232,185,48,0.12);
    }
    .btn-speak:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .btn-speak svg, .btn-record svg, .btn-rerecord svg, .btn-dismiss svg {
      width: 13px; height: 13px; fill: currentColor; flex-shrink: 0;
    }

    .btn-dismiss {
      border-color: rgba(154,146,152,0.2);
      background: transparent; color: var(--text-muted);
    }
    .btn-dismiss:hover, .btn-dismiss:focus-visible {
      border-color: var(--text-muted); color: var(--text);
    }
    .btn-dismiss:focus-visible { outline: 2px solid var(--text-muted); outline-offset: 2px; }

    .btn-record {
      border-color: rgba(224,96,112,0.35);
      background: rgba(224,96,112,0.06);
      color: var(--rose);
    }
    .btn-record:hover, .btn-record:focus-visible {
      background: rgba(224,96,112,0.15); border-color: var(--rose);
      box-shadow: 0 0 14px rgba(224,96,112,0.12);
    }
    .btn-record:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

    .btn-record.recording {
      border-color: var(--rose);
      background: rgba(224,96,112,0.15);
      animation: recPulse 1.5s ease-in-out infinite;
      min-width: 110px; justify-content: center;
    }
    @keyframes recPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(224,96,112,0.3); }
      50%     { box-shadow: 0 0 16px 4px rgba(224,96,112,0.12); }
    }

    .rec-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #e04050; display: inline-block; flex-shrink: 0;
      animation: dotPulse 0.8s ease-in-out infinite;
    }
    @keyframes dotPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.3;transform:scale(0.8)} }

    .rec-timer {
      font-size: 0.72rem; font-weight: 500; color: var(--rose);
      font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: center;
    }

    .btn-rerecord {
      border-color: rgba(192,160,255,0.3);
      background: rgba(192,160,255,0.06);
      color: var(--lavender);
    }
    .btn-rerecord:hover, .btn-rerecord:focus-visible {
      background: rgba(192,160,255,0.15); border-color: var(--lavender);
    }
    .btn-rerecord:focus-visible { outline: 2px solid var(--lavender); outline-offset: 2px; }

    .record-error {
      width: 100%; text-align: right;
      font-size: 0.6rem; color: var(--rose); opacity: 0.9;
      margin-bottom: 0.2rem; padding: 0.25rem 0;
    }

    .sparkle {
      position: fixed; pointer-events: none; z-index: 250;
      border-radius: 50%;
      animation: sparklePop 0.7s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }
    @keyframes sparklePop { 0%{opacity:1;transform:translate(0,0) scale(1)} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)} }

    .heart-overlay {
      position: fixed; inset: 0; z-index: 9000;
      display: flex; align-items: center; justify-content: center;
      pointer-events: auto;
    }
    .heart-overlay .heart-bg {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.65);
      animation: heartOverlayIn 0.5s ease forwards;
    }
    @keyframes heartOverlayIn { from{opacity:0} to{opacity:1} }

    .heart-popup {
      position: relative; z-index: 1;
      width: min(420px, 90vw); min-height: 320px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2.8rem 2rem 2.2rem;
      animation: heartPopupIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes heartPopupIn {
      0%   { opacity: 0; transform: scale(0.2) rotate(-15deg); }
      50%  { opacity: 1; transform: scale(1.08) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    .heart-popup.heart-exit {
      animation: heartPopupOut 0.6s ease forwards;
    }
    @keyframes heartPopupOut {
      to { opacity: 0; transform: scale(0.7) translateY(-30px); }
    }

    .heart-popup .heart-shape {
      position: absolute; inset: 0;
      filter: drop-shadow(0 0 40px rgba(224,96,112,0.3)) drop-shadow(0 0 80px rgba(232,185,48,0.15));
    }
    .heart-popup .heart-shape svg { width: 100%; height: 100%; }

    .heart-popup .heart-title {
      position: relative; z-index: 2;
      font-family: var(--font-display);
      font-weight: 600; font-style: italic;
      font-size: clamp(1.3rem, 3.5vw, 1.7rem);
      color: #fff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
      margin-bottom: 1rem;
      animation: heartTextIn 0.8s ease 0.4s both;
    }
    .heart-popup .heart-greetings {
      position: relative; z-index: 2;
      list-style: none; padding: 0; margin: 0;
      width: 100%; max-width: 300px;
    }
    .heart-popup .heart-greetings li {
      margin-bottom: 0.55rem;
      opacity: 0;
      animation: heartGreetIn 0.4s ease forwards;
    }
    .heart-popup .heart-greetings li:nth-child(1) { animation-delay: 0.6s; }
    .heart-popup .heart-greetings li:nth-child(2) { animation-delay: 0.8s; }
    .heart-popup .heart-greetings li:nth-child(3) { animation-delay: 1.0s; }
    .heart-popup .heart-greetings li:nth-child(4) { animation-delay: 1.2s; }
    .heart-popup .heart-greetings li:nth-child(5) { animation-delay: 1.4s; }
    @keyframes heartGreetIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    .heart-popup .heart-greet-label {
      font-family: var(--font-body);
      font-size: 0.55rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.1em;
      display: block; margin-bottom: 0.15rem;
    }
    .heart-popup .heart-greet-text {
      font-family: var(--font-display);
      font-size: clamp(0.82rem, 2.2vw, 0.95rem);
      font-weight: 400; line-height: 1.5;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }
    .heart-popup .heart-progress {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 3px; z-index: 3; overflow: hidden; border-radius: 0 0 50% 50%;
    }
    .heart-popup .heart-progress-bar {
      height: 100%; background: var(--gold);
      transform-origin: left;
      animation: heartProgress 5s linear forwards;
    }
    @keyframes heartProgress { from{transform:scaleX(1)} to{transform:scaleX(0)} }

    @keyframes heartTextIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

    .heart-trail {
      position: fixed; pointer-events: none; z-index: 600;
      animation: heartFloat 1.6s ease-out forwards;
    }
    @keyframes heartFloat {
      0%   { opacity:1; transform:translate(0,0) scale(1) rotate(0deg); }
      20%  { opacity:0.95; transform:translate(calc(var(--dx)*0.3),calc(var(--dy)*0.3-12px)) scale(1.15) rotate(calc(var(--sp)*0.2)); }
      60%  { opacity:0.6; transform:translate(calc(var(--dx)*0.7),calc(var(--dy)*0.7-40px)) scale(0.85) rotate(calc(var(--sp)*0.6)); }
      100% { opacity:0; transform:translate(var(--dx),calc(var(--dy)-70px)) scale(0.3) rotate(var(--sp)); }
    }
    .heart-glow {
      position: fixed; pointer-events: none; z-index: 599;
      border-radius: 50%;
      animation: glowPulse 0.9s ease-out forwards;
    }
    @keyframes glowPulse { 0%{opacity:0.45;transform:translate(-50%,-50%) scale(0.5)} 100%{opacity:0;transform:translate(-50%,-50%) scale(2.5)} }

    #trailCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 598; touch-action: none; }
    #fireworksCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 8998; touch-action: none; }

    .counter {
      position: fixed; bottom: 1.2rem; left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-body);
      font-size: 0.7rem; color: var(--text-muted);
      letter-spacing: 0.06em; z-index: 500;
      opacity: 0; animation: fadeDown 0.7s ease 0.7s forwards;
      white-space: nowrap;
    }
    .counter strong { color: var(--gold); font-weight: 500; }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* small phones */
    @media (max-width: 360px) {
      body::before { opacity: 0.15; }
      .header { padding: 0.8rem 0.7rem 0.3rem; }
      .title { font-size: 1.3rem; }
      .subtitle { font-size: 0.6rem; }
      .categories { gap: 0.25rem; padding-top: 0.5rem; }
      .pill { padding: 0.35rem 0.6rem; font-size: 0.55rem; }
      .lang-sep { height: 0.8rem; margin: 0 0.08rem; }
      .blessing { max-width: 95vw; padding: 0.85rem 0.9rem 0.7rem; border-radius: 10px; }
      .blessing-text { font-size: 0.92rem; }
      .voice-badge { font-size: 0.48rem; bottom: 2.4rem; padding: 0.2rem 0.5rem; }
      .counter { font-size: 0.6rem; bottom: 1rem; }
      .prompt-icon { font-size: 2.2rem; }
      .prompt-text { font-size: 0.95rem; }
    }
    /* phones */
    @media (min-width: 361px) and (max-width: 480px) {
      body::before { opacity: 0.2; }
      .header { padding: 1rem 1rem 0.4rem; }
      .categories { gap: 0.3rem; padding-top: 0.6rem; }
      .pill { padding: 0.3rem 0.7rem; font-size: 0.58rem; }
      .blessing { max-width: 92vw; padding: 1rem 1.1rem 0.85rem; border-radius: 12px; }
      .voice-badge { font-size: 0.52rem; bottom: 2.6rem; }
    }
    /* tablets */
    @media (min-width: 481px) and (max-width: 768px) {
      .header { padding: 1.2rem 1.2rem 0.5rem; }
      .categories { gap: 0.35rem; }
      .pill { padding: 0.32rem 0.8rem; font-size: 0.65rem; }
      .blessing { max-width: min(380px, 88vw); padding: 1.1rem 1.2rem 0.9rem; }
      .voice-badge { font-size: 0.54rem; bottom: 2.6rem; }
    }
    /* landscape phones */
    @media (max-height: 500px) and (orientation: landscape) {
      .header { padding: 0.5rem 1rem 0.3rem; }
      .title { font-size: 1.2rem; }
      .subtitle { display: none; }
      .categories { gap: 0.25rem; padding-top: 0.3rem; }
      .pill { padding: 0.25rem 0.6rem; font-size: 0.55rem; }
      .prompt-icon { font-size: 1.8rem; }
      .prompt-text { font-size: 0.9rem; }
      .blessing { max-width: min(320px, 70vw); padding: 0.7rem 0.9rem 0.6rem; }
      .blessing-text { font-size: 0.9rem; line-height: 1.4; }
      .blessing-cat { margin-bottom: 0.35rem; }
      .blessing-actions { margin-top: 0.5rem; }
      .voice-badge { bottom: 0.6rem; font-size: 0.48rem; }
      .counter { bottom: 0.5rem; font-size: 0.6rem; }
    }
    /* large desktops */
    @media (min-width: 1200px) {
      .blessing { max-width: 400px; }
      .pill { padding: 0.4rem 1.1rem; }
    }

          exitBtn.remove();

        }

          // Last step: show both Continue and Exit buttons
          btnEl.textContent = '继续';

    function scoreVoice(voice, targetLang) {
      var s = 0, name = voice.name.toLowerCase(), lang = voice.lang.toLowerCase();
      if (lang === targetLang) s += 10;
      else if (lang.indexOf(targetLang.split('-')[0]) === 0) s += 6;
      else return -1;
      for (var i = 0; i < FEMALE_HINTS.length; i++) { if (name.indexOf(FEMALE_HINTS[i]) > -1) { s += 20; break; } }
      if (name.indexOf('female') > -1) s += 15;
      for (var j = 0; j < MALE_HINTS.length; j++) { if (name.indexOf(MALE_HINTS[j]) > -1) { s -= 15; break; } }
      if (name.indexOf('google') > -1)   s += 12;
      if (name.indexOf('enhanced') > -1) s += 10;
      if (name.indexOf('premium') > -1)  s += 10;
      if (name.indexOf('natural') > -1)  s += 9;
      if (name.indexOf('neural') > -1)   s += 9;
      if (name.indexOf('wavenet') > -1)  s += 8;
      if (!voice.localService)           s += 5;
      return s;
    }

        var voices = window.speechSynthesis.getVoices();
        if (!voices || !voices.length) return null;
        var best = null, bestScore = -1;
        for (var i = 0; i < voices.length; i++) {
          var sc = scoreVoice(voices[i], langCode);
          if (sc > bestScore) { bestScore = sc; best = voices[i]; }
        }
        return best;
      } catch(e) { return null; }
    }

    /* ================================================================

       ================================================================ */
    function writeWavString(view, offset, str) {
      for (var i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }

    function encodeWav(samples, sampleRate) {
      var buf = new ArrayBuffer(44 + samples.length * 2);
      var v = new DataView(buf);
      writeWavString(v, 0, 'RIFF');
      v.setUint32(4, 36 + samples.length * 2, true);
      writeWavString(v, 8, 'WAVE');
      writeWavString(v, 12, 'fmt ');
      v.setUint32(16, 16, true);
      v.setUint16(20, 1, true);
      v.setUint16(22, 1, true);
      v.setUint32(24, sampleRate, true);
      v.setUint32(28, sampleRate * 2, true);
      v.setUint16(32, 2, true);
      v.setUint16(34, 16, true);
      writeWavString(v, 36, 'data');
      v.setUint32(40, samples.length * 2, true);
      for (var i = 0; i < samples.length; i++) {
        var s = Math.max(-1, Math.min(1, samples[i]));
        v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
      return new Blob([buf], { type: 'audio/wav' });
    }

    var REC_MR_SUPPORTED = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
    var REC_WAV_SUPPORTED = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && (window.AudioContext || window.webkitAudioContext));

    function getRecMime() {
      if (!window.MediaRecorder) return '';
      var types = [
        'audio/webm;codecs=opus', 'audio/webm',
        'audio/ogg;codecs=opus', 'audio/ogg',
        'audio/mp4', 'audio/aac'
      ];
      for (var i = 0; i < types.length; i++) {
        try { if (MediaRecorder.isTypeSupported(types[i])) return types[i]; } catch(e){}
      }
      return '';
    }

    function cleanupRec(card) {
      var r = recordings.get(card);
      if (!r) return;
      if (r.timerIv) clearInterval(r.timerIv);
      if (r.maxTimer) clearTimeout(r.maxTimer);
      if (r.rec && r.rec.state !== 'inactive') { try { r.rec.stop(); } catch(e){} }
      if (r.wavProcessor) { try { r.wavProcessor.disconnect(); } catch(e){} }
      if (r.wavSource) { try { r.wavSource.disconnect(); } catch(e){} }
      if (r.wavCtx) { try { r.wavCtx.close(); } catch(e){} }
      if (r.stream) r.stream.getTracks().forEach(function(t){ t.stop(); });
      if (r.audio) { r.audio.pause(); r.audio.src = ''; r.audio = null; }
      if (r.url) { try { URL.revokeObjectURL(r.url); } catch(e){} r.url = null; }
      r.blob = null;
      recordings.delete(card);
    }

    function startRec(card) {

            tryMediaRecorder(card, stream);
          } else {

          }

        .catch(function(err) {

      var mime = getRecMime(), rec;
      try { rec = new MediaRecorder(stream, mime ? {mimeType:mime} : {}); }

            .catch(function(){ renderRecErr(card,'rec'); });
        } else {
          renderRecErr(card,'rec');
        }
        return;
      }}

      var chunks = [];
      rec.ondataavailable = function(e) { if (e.data && e.data.size > 0) chunks.push(e.data); };
      rec.onstop = function() {
        stream.getTracks().forEach(function(t){ t.stop(); });

        if (!r || r.state === 'cancelled') return;

    function startWavRec(card, stream) {
      try {
        var audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        var chunks = [];
        var sampleRate = audioCtx.sampleRate;

        processor.onaudioprocess = function(e) {
          var data = e.inputBuffer.getChannelData(0);
          chunks.push(new Float32Array(data));
        };

        source.connect(processor);
        processor.connect(silentGain);
        silentGain.connect(audioCtx.destination);

        recordings.set(card, {
          rec:null, stream:stream, chunks:chunks, blob:null, url:null, audio:null,
          timerIv:null, maxTimer:null, state:'recording', engine:'wav',
          wavCtx:audioCtx, wavSource:source, wavProcessor:processor, sampleRate:sampleRate

      } catch(e) {
        stream.getTracks().forEach(function(t){ t.stop(); });
        renderRecErr(card, 'rec');
      }
    }

    function stopRec(card) {
      var r = recordings.get(card);
      if (!r) return;
      if (r.timerIv) { clearInterval(r.timerIv); r.timerIv = null; }
      if (r.maxTimer) { clearTimeout(r.maxTimer); r.maxTimer = null; }

      if (r.engine === 'wav') {
        stopWavRec(card);
      } else if (r.rec && r.rec.state !== 'inactive') {

      }

    function stopWavRec(card) {
      var r = recordings.get(card);
      if (!r || r.engine !== 'wav') return;

      try { r.wavProcessor.disconnect(); r.wavSource.disconnect(); r.wavCtx.close(); } catch(e){}

      var length = 0;
      for (var i = 0; i < r.chunks.length; i++) length += r.chunks[i].length;
      if (length === 0) { r.stream.getTracks().forEach(function(t){t.stop();}); renderRecErr(card,'rec'); return; }

      var buffer = new Float32Array(length);
      var offset = 0;
      for (var i = 0; i < r.chunks.length; i++) {
        buffer.set(r.chunks[i], offset);
        offset += r.chunks[i].length;
      }

      r.stream.getTracks().forEach(function(t){ t.stop(); });
      r.blob = wavBlob; r.url = URL.createObjectURL(wavBlob); r.stream = null; r.wavCtx = null; r.wavSource = null; r.wavProcessor = null;
      r.state = 'recorded';
      renderRecDone(card);
    }

    /* ================================================================
       EMOTIONAL TTS ENGINE
       ================================================================ */
    function getProsody(cat, pos, total) {
      var t = total > 1 ? pos/(total-1) : 0.5;
      var r = (Math.random()-0.5)*0.03;
      switch(cat) {
        case 'happy':       return { pMul: 1.0+0.10*Math.sin(t*Math.PI)+r,         rMul: 1.0+0.04*Math.sin(t*Math.PI*0.8) };
        case 'sad':         return { pMul: 1.0-0.12*t+r,                             rMul: 1.0-0.06*t };
        case 'encouraging': return { pMul: 0.95+0.15*t+r,                            rMul: 0.97+0.06*t };
        case 'birthday':    return { pMul: 1.0+0.07*Math.sin(t*Math.PI*1.2)+r,      rMul: 1.0+0.02*Math.sin(t*Math.PI) };
        case 'luck':        return { pMul: 1.0+0.06*Math.sin(t*Math.PI*1.5)+r,      rMul: 0.98+0.03*Math.sin(t*Math.PI) };
        default:            return { pMul: 1.0, rMul: 1.0 };
      }
    }

    function splitSpeech(text, lang) {
      var useLatin = (lang === 'en' || lang === 'de' || lang === 'ko');
      var raw = useLatin ? text.split(/([,.\u2026;:!?]+)/) : text.split(/([\u3001\u3002\uff01\uff1f]+)/);
      var isP = useLatin ? /^[,.\u2026;:!?]+$/ : /^[\u3001\u3002\uff01\uff1f]+$/;
      var parts = [];
      for (var i = 0; i < raw.length; i++) {
        if (!raw[i] || !raw[i].trim()) continue;
        if (isP.test(raw[i])) { if (parts.length) parts[parts.length-1] += raw[i]; }
        else parts.push(raw[i].trim());
      }
      return parts.filter(function(s){return s.length>0;});
    }

    var resumeTm = null;
    function speakEmotionally(text, category, btn) {
      if (!speechSupported) return;
      window.speechSynthesis.cancel();
      speechGen++;
      var myGen = speechGen;

      var voice = bestVoices[speechLang];
      if (!voice) { var fb = window.speechSynthesis.getVoices(); if (fb.length) voice = fb[0]; else return; }

      var params = MOOD[speechLang][category] || MOOD[speechLang].luck;
      var segs = splitSpeech(text, speechLang);
      var n = segs.length, ui = UI[speechLang];

      var plan = [];
      for (var i = 0; i < n; i++) {
        var pc = getProsody(category, i, n);
        plan.push({
          text: segs[i],
          rate: Math.max(0.5,Math.min(2, params.rate*pc.rMul + (Math.random()-0.5)*0.02)),
          pitch: Math.max(0,Math.min(2, params.pitch*pc.pMul + (Math.random()-0.5)*0.02)),
          vol: Math.max(0,Math.min(1, params.vol)),
          pause: (i === n-1) ? 0 : params.pauseMid
        });
      }
      for (var j = 0; j < plan.length-1; j++) {
        if (/[.!?\u2026\u3002\uff01\uff1f]$/.test(segs[j])) plan[j].pause = params.pauseEnd;
      }

      var label = btn ? btn.querySelector('.speak-label') : null;
      if (label) label.textContent = ui.speaking;
      if (btn) btn.disabled = true;

      clearInterval(resumeTm);
      resumeTm = setInterval(function(){ if(window.speechSynthesis.speaking&&window.speechSynthesis.paused) window.speechSynthesis.resume(); }, 800);

      var idx = 0;
      function next() {
        if (myGen !== speechGen || idx >= plan.length) { cleanup(); return; }
        if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        var p = plan[idx], u = new SpeechSynthesisUtterance(p.text);
        u.voice = voice; u.rate = p.rate; u.pitch = p.pitch; u.volume = p.vol;
        var done = false;
        var to = setTimeout(function(){ if(!done){done=true;idx++;next();} }, 25000);
        u.onend = function(){ if(done)return;done=true;clearTimeout(to);idx++; if(p.pause>0)setTimeout(next,p.pause);else next(); };
        u.onerror = function(){ if(done)return;done=true;clearTimeout(to);idx++;next(); };
        window.speechSynthesis.speak(u);
      }
      function cleanup(){ clearInterval(resumeTm); if(label)label.textContent=ui.speak; if(btn)btn.disabled=false; }
      next();
    }

    /* ================================================================

    var canvas = document.getElementById('trailCanvas');

    var hearts = [], HEART_MAX = 50;
    var HEART_C = ['#e06070','#f08080','#e8b930','#c0a0ff','#ff9ab0','#ffccaa','#ffa0c0','#f0d060','#d080ff','#ff7090'];

    function resizeCanvas() {

      canvas.width=window.innerWidth*d; canvas.height=window.innerHeight*d;

    function drawHeart(cx,cy,sz,col,a,r) {
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(r);
      /* glow layer — simple circle instead of per-frame gradient allocation */
      var gs=sz*1.8;
      ctx.globalAlpha=a*0.18; ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(0,sz*0.35,gs*0.5,0,Math.PI*2); ctx.fill();
      /* heart shape */
      ctx.globalAlpha=a; ctx.fillStyle=col;
      var s=sz; ctx.beginPath();
      ctx.moveTo(0,s*0.35); ctx.bezierCurveTo(0,s*0.1,-s*0.5,-s*0.15,-s*0.5,s*0.15);
      ctx.bezierCurveTo(-s*0.5,s*0.45,0,s*0.6,0,s*0.85);
      ctx.bezierCurveTo(0,s*0.6,s*0.5,s*0.45,s*0.5,s*0.15);
      ctx.bezierCurveTo(s*0.5,-s*0.15,0,s*0.1,0,s*0.35);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }

    function spawnH(x,y,drag) {
      if(hearts.length>=HEART_MAX) hearts.shift();
      var life=drag ? 0.4+Math.random()*0.5 : 0.8+Math.random()*0.9;
      var spd=drag ? 0.3+Math.random()*0.6 : 0.4+Math.random()*1.2;
      var vyr=drag ? -Math.abs(Math.sin(Math.random()*6.28))*spd-0.3 : -Math.abs(Math.sin(Math.random()*6.28))*spd-0.6;
      hearts.push({x:x,y:y,vx:Math.cos(Math.random()*6.28)*spd,vy:vyr,grav:drag?0.003:0.01,size:5+Math.random()*12,rot:(Math.random()-0.5)*0.6,spin:(Math.random()-0.5)*0.04,alpha:1,life:life,ml:life,col:HEART_C[Math.floor(Math.random()*HEART_C.length)]});
      startAnim();
    }
    var DOM_MAX=8;
    function spawnDomH(x,y) {
      var existing=document.querySelectorAll('.heart-trail,.heart-glow');
      if(existing.length>=DOM_MAX*2) { for(var k=0;k<3;k++){if(existing[k])existing[k].remove();} }
      var el=document.createElement('div');el.className='heart-trail';el.setAttribute('aria-hidden','true');
      var sz=10+Math.floor(Math.random()*16),dx=(Math.random()-0.5)*40,dy=(Math.random()-0.5)*20,sp=(Math.random()-0.5)*60,c=HEART_C[Math.floor(Math.random()*HEART_C.length)];
      el.style.cssText='left:'+(x-sz/2)+'px;top:'+(y-sz/2)+'px;width:'+sz+'px;height:'+sz+'px;--dx:'+dx+'px;--dy:'+dy+'px;--sp:'+sp+'deg;';
      el.innerHTML='<svg viewBox="0 0 32 32" width="'+sz+'" height="'+sz+'"><path d="M16 28s-11-7.5-11-15C5 8.5 7.5 6 10.5 6c1.8 0 3.5 1 4.5 2.5C16 7 17.2 6 19 6 20.5 6 22 6.5 23 8c1 1.5 1.5 3 1.5 5 0 7.5-11 15-11 15z" fill="'+c+'"/></svg>';
      document.body.appendChild(el);
      var g=document.createElement('div');g.className='heart-glow';g.setAttribute('aria-hidden','true');
      g.style.cssText='left:'+x+'px;top:'+y+'px;width:'+(sz*2)+'px;height:'+(sz*2)+'px;background:radial-gradient(circle,'+c+'33 0%,transparent 70%);';
      document.body.appendChild(g);
      setTimeout(function(){if(el.parentNode)el.remove();},1650);
      setTimeout(function(){if(g.parentNode)g.remove();},950);
    }
    document.addEventListener('visibilitychange',function(){
      if(document.hidden){
        var old=document.querySelectorAll('.heart-trail,.heart-glow');
        for(var i=0;i<old.length;i++)old[i].remove();
        hearts.length=0;
        if(animId){cancelAnimationFrame(animId);animRunning=false;animId=0;}
        var dpr=window.devicePixelRatio||1;
        ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);
        fwParticles.length=0;
        if(fwAnimId){cancelAnimationFrame(fwAnimId);fwRunning=false;fwAnimId=0;}
        fwCtx.clearRect(0,0,fwCanvas.width/dpr,fwCanvas.height/dpr);
      }
    });

    var lastF=0,animRunning=false,animId=0;
    function animH(ts) {
      if(!lastF){lastF=ts;}
      var dt=Math.min((ts-lastF)/1000,0.05); lastF=ts;
      var dpr=window.devicePixelRatio||1;
      ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);
      for(var i=hearts.length-1;i>=0;i--) {
        var h=hearts[i]; h.x+=h.vx;h.y+=h.vy;h.vy+=h.grav;h.rot+=h.spin;h.life-=dt;h.alpha=Math.max(0,h.life/h.ml);
        if(h.life<=0){hearts.splice(i,1);continue;}
        var sc=0.3+0.7*(h.life/h.ml);
        drawHeart(h.x,h.y,h.size*sc,h.col,h.alpha*0.8,h.rot);
      }
      if(hearts.length>0){animId=requestAnimationFrame(animH);}
      else{animRunning=false;animId=0;ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);}
    }
    function startAnim(){if(!animRunning){animRunning=true;lastF=0;animId=requestAnimationFrame(animH);}}

    /* ================================================================
       MOUSE / TOUCH TRAIL
       ================================================================ */
    var trTh=0,TR_INT=60,isDn=false,lTX=0,lTY=0;
    function handleTr(x,y){var now=Date.now();if(now-trTh<TR_INT)return;var dx=x-lTX,dy=y-lTY;if(Math.sqrt(dx*dx+dy*dy)<3&&!isDn)return;trTh=now;lTX=x;lTY=y;var n=isDn?2:1;for(var i=0;i<n;i++)spawnH(x+(Math.random()-0.5)*16,y+(Math.random()-0.5)*16,isDn);if(isDn||Math.random()<0.1)spawnDomH(x+(Math.random()-0.5)*10,y+(Math.random()-0.5)*10);}
    document.addEventListener('mousemove',function(e){handleTr(e.clientX,e.clientY);});
    document.addEventListener('mousedown',function(e){isDn=true;handleTr(e.clientX,e.clientY);});
    document.addEventListener('mouseup',function(){isDn=false;});
    document.addEventListener('touchmove',function(e){if(e.touches.length)handleTr(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
    document.addEventListener('touchstart',function(e){isDn=true;if(e.touches.length)handleTr(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
    document.addEventListener('touchend',function(){isDn=false;});

      var cs=['#e8b930','#f0d060','#e06070','#c0a0ff','#f5f0e8','#ffe0a0'];
      for(var i=0;i<4;i++){
        var s=document.createElement('div');s.className='sparkle';s.setAttribute('aria-hidden','true');
        var a=(Math.PI*2*i)/4+(Math.random()-0.5)*0.7,d=22+Math.random()*50,sz=2+Math.random()*4;
        s.style.cssText='left:'+x+'px;top:'+y+'px;width:'+sz+'px;height:'+sz+'px;background:'+cs[i%6]+';';
        s.style.setProperty('--tx',(Math.cos(a)*d)+'px');s.style.setProperty('--ty',(Math.sin(a)*d)+'px');
        document.body.appendChild(s);

      spawnDomH(x+(Math.random()-0.5)*20,y+(Math.random()-0.5)*20);
    }

      card.className = 'blessing';
      card.setAttribute('role', 'status');

      catDiv.textContent = LABELS[speechLang][b.category];

      var textP = document.createElement('p');
      textP.className = 'blessing-text';
      textP.textContent = b.text;

      var actions = document.createElement('div');
      actions.className = 'blessing-actions';

      card.appendChild(catDiv);
      card.appendChild(textP);
      card.appendChild(actions);

      var vw=window.innerWidth, vh=window.innerHeight;

      card.style.top=Math.max(90,Math.min(y-ch/2-20,vh-ch-50))+'px';

      document.body.appendChild(card);
      activeCards.push(card);

      /*
       * Recording: Chinese only
       * German / English / Japanese: TTS system voice playback
       */
      var showRec = (speechLang === 'zh') && REC_SUPPORTED;

      if (showRec) {
        renderRecIdle(card);
      } else if (speechSupported) {
        var u = UI[speechLang];
        var speakBtn = mkBtn('btn-speak', SVG.speaker, u.speak, u.speak);
        speakBtn.addEventListener('click', (function(txt,cat,btn){
          return function(e){ e.stopPropagation(); speakEmotionally(txt,cat,btn); };
        })(b.text, b.category, speakBtn));
        actions.appendChild(speakBtn);
        addCloseBtn(actions, card);
      } else {
        addCloseBtn(actions, card);
      }

      blessingCount++;
      countEl.textContent = blessingCount;
      liveEl.textContent = UI[speechLang].newBless + b.text;

      if (promptEl && promptEl.parentNode) {
        promptEl.classList.add('hidden');
        setTimeout(function(){ if(promptEl.parentNode) promptEl.remove(); }, 600);
      }
      setTimeout(function(){ dismissCard(card); }, 9000);

      fwCtx.setTransform(d, 0, 0, d, 0, 0);
    }
    resizeFwCanvas();
    window.addEventListener('resize', function(){ resizeFwCanvas(); });

    var FW_COLORS = [
      '#ff4060','#ff6040','#ff8030','#e8b930','#ffd040',
      '#40ff80','#40c8ff','#8060ff','#c0a0ff','#ff60b0',
      '#ff4080','#60e0ff','#a0ff40','#ff60e0','#f0a0b0'
    ];

    function fwHexToRgb(hex) {
      var r = parseInt(hex.slice(1,3),16);
      var g = parseInt(hex.slice(3,5),16);
      var b = parseInt(hex.slice(5,7),16);
      return r+','+g+','+b;
    }

    function FwParticle(x, y, vx, vy, color, type) {
      this.x = x; this.y = y;
      this.vx = vx; this.vy = vy;
      this.color = color;
      this.alpha = type === 'trail' ? 0.6 : 1;
      this.decay = type === 'trail' ? (0.015 + Math.random()*0.02) :
                   type === 'sparkle' ? (0.008 + Math.random()*0.015) :
                   (0.012 + Math.random()*0.01);
      this.size = type === 'trail' ? (1.5 + Math.random()*1.5) :
                  type === 'sparkle' ? (1 + Math.random()*3) :
                  (1.5 + Math.random()*3);
      this.type = type;
      this.gravity = type === 'trail' ? 0.03 : 0.02 + Math.random()*0.015;
      this.drag = type === 'trail' ? 0.99 : 0.98 + Math.random()*0.015;
      this.rotation = Math.random() * Math.PI * 2;
      this.rotSpeed = (Math.random()-0.5) * 0.2;
    }

    function ensureFwRunning() {
      if (!fwRunning) { fwRunning = true; fwAnimId = requestAnimationFrame(fwAnimLoop); }
    }

    function fwCreateExplosion(x, y) {
      var count = 60 + Math.floor(Math.random()*40);
      var color = FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)];
      var rgb = fwHexToRgb(color);
      var hasSecondary = Math.random() < 0.5;
      var color2 = hasSecondary ? FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)] : null;
      var rgb2 = color2 ? fwHexToRgb(color2) : null;
      var pattern = Math.random();

      for (var i = 0; i < count; i++) {
        var angle, speed, pColor, pRgb;
        if (pattern < 0.25) {
          angle = (i / count) * Math.PI * 2;
          speed = 2 + Math.random()*4;
        } else if (pattern < 0.5) {
          angle = Math.random() * Math.PI * 2;
          speed = 3 + Math.random()*6;
        } else if (pattern < 0.75) {
          angle = Math.random() * Math.PI * 2;
          speed = 1 + Math.random()*8;
        } else {
          angle = (i / count) * Math.PI * 2 + (Math.random()-0.5)*0.5;
          speed = 2 + Math.random()*7;
        }
        pColor = (hasSecondary && Math.random()<0.3) ? color2 : color;
        pRgb = (hasSecondary && Math.random()<0.3) ? rgb2 : rgb;
        fwParticles.push(new FwParticle(x, y,
          Math.cos(angle)*speed, Math.sin(angle)*speed, pColor, 'sparkle'));
        if (i < count*0.2) {
          fwParticles.push(new FwParticle(x, y,
            Math.cos(angle)*speed*0.5+(Math.random()-0.5)*2,
            Math.sin(angle)*speed*0.5+(Math.random()-0.5)*2,
            pColor, 'flash'));
        }
      }
      ensureFwRunning();
    }

    function fwCreateTrail(x, y) {
      var count = 20 + Math.floor(Math.random()*15);
      var color = FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)];
      for (var i = 0; i < count; i++) {
        var angle = Math.random()*Math.PI*2;
        var speed = 1 + Math.random()*3;
        fwParticles.push(new FwParticle(x, y,
          Math.cos(angle)*speed, Math.sin(angle)*speed, color, 'trail'));
      }
      ensureFwRunning();
    }

    function launchFirework() {
      var x = Math.random()*window.innerWidth;
      var targetY = Math.random()*window.innerHeight*0.5 + 50;
      var trailCount = 8 + Math.floor(Math.random()*6);
      var color = FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)];
      var cx = x + (Math.random()-0.5)*200;
      cx = Math.max(50, Math.min(window.innerWidth-50, cx));

      for (var i = 0; i < trailCount; i++) {
        var progress = i / trailCount;
        var px = cx + (Math.random()-0.5)*8;
        var py = window.innerHeight - progress * (window.innerHeight - targetY);
        fwParticles.push(new FwParticle(px, py,
          (Math.random()-0.5)*0.5, -1.5+Math.random()*0.5,
          color, 'trail'));
      }
      ensureFwRunning();

      var delay = 300 + Math.random()*500;
      setTimeout(function(){ fwCreateExplosion(cx, targetY); fwCreateTrail(cx, targetY); }, delay);
    }

    function fwAnimLoop() {
      var dpr = window.devicePixelRatio || 1;
      fwCtx.clearRect(0, 0, fwCanvas.width/dpr, fwCanvas.height/dpr);

      for (var i = fwParticles.length-1; i >= 0; i--) {
        var p = fwParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= p.drag;
        p.vy *= p.drag;
        p.alpha -= p.decay;
        p.rotation += p.rotSpeed;
        if (p.alpha <= 0) { fwParticles.splice(i,1); continue; }

        if (p.type === 'sparkle') {
          var sz = p.size * p.alpha;
          fwCtx.save();
          fwCtx.globalAlpha = p.alpha * 0.8;
          fwCtx.fillStyle = p.color;
          fwCtx.beginPath();
          var a = p.rotation, r = sz;
          for (var k = 0; k < 4; k++) {
            var ang = a + k*Math.PI/2;
            fwCtx.lineTo(Math.cos(ang)*r, Math.sin(ang)*r);
            fwCtx.lineTo(Math.cos(ang+Math.PI/4)*r*0.4, Math.sin(ang+Math.PI/4)*r*0.4);
          }
          fwCtx.closePath();
          fwCtx.fill();
          fwCtx.globalAlpha = p.alpha * 0.3;
          fwCtx.shadowColor = p.color;
          fwCtx.shadowBlur = 8;
          fwCtx.fill();
          fwCtx.restore();
          p.size *= 0.998;
        } else if (p.type === 'trail') {
          fwCtx.globalAlpha = p.alpha * 0.7;
          fwCtx.fillStyle = p.color;
          fwCtx.beginPath();
          fwCtx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI*2);
          fwCtx.fill();
          fwCtx.globalAlpha = p.alpha * 0.3;
          fwCtx.beginPath();
          fwCtx.arc(p.x, p.y, p.size * 1.2, 0, Math.PI*2);
          fwCtx.fill();
          fwCtx.globalAlpha = 1;
        } else {
          fwCtx.save();
          fwCtx.globalAlpha = p.alpha * 0.5;
          fwCtx.fillStyle = '#fff';
          fwCtx.beginPath();
          fwCtx.arc(p.x, p.y, p.size * p.alpha * 2, 0, Math.PI*2);
          fwCtx.fill();
          fwCtx.restore();
        }
      }

      if (fwParticles.length > 0) {
        fwAnimId = requestAnimationFrame(fwAnimLoop);
      } else {
        fwRunning = false;
        fwAnimId = 0;
        var d = window.devicePixelRatio||1;
        fwCtx.clearRect(0, 0, fwCanvas.width/d, fwCanvas.height/d);
      }
    }

    function startFireworks() {
      fwParticles.length = 0;
      var waves = 3;
      for (var w = 0; w < waves; w++) {
        var count = 3 + Math.floor(Math.random()*3);
        for (var i = 0; i < count; i++) {
          (function(delay){ setTimeout(function(){ launchFirework(); }, delay); })(w*500 + i*300 + Math.random()*200);
        }
      }
      if (!fwRunning) { fwRunning = true; fwAnimId = requestAnimationFrame(fwAnimLoop); }
    }

    /* ================================================================
       HEART POPUP — Multi-language blessing display
       ================================================================ */
    var heartPopupActive = false;
    function showHeartPopup() {
      if (heartPopupActive) return;
      heartPopupActive = true;

      /* Pick one random blessing from each language */
      var greetings = [];
      var langs = ['en','zh','ja','de','ko'];
      for (var i = 0; i < langs.length; i++) {
        var lang = langs[i];
        var pool = BLESSINGS[lang];
        var cats = Object.keys(pool);
        var cat = cats[Math.floor(Math.random() * cats.length)];
        var arr = pool[cat];
        var text = arr[Math.floor(Math.random() * arr.length)];
        greetings.push({ lang: lang, label: UI[lang].popupLabel, text: text });
      }

      /* Overlay */
      var overlay = document.createElement('div');
      overlay.className = 'heart-overlay';

      /* Background */
      var bg = document.createElement('div');
      bg.className = 'heart-bg';
      overlay.appendChild(bg);

      /* Heart container */
      var popup = document.createElement('div');
      popup.className = 'heart-popup';

      /* SVG heart shape background */
      var heartShape = document.createElement('div');
      heartShape.className = 'heart-shape';
      heartShape.innerHTML = '<svg viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg">' +
        '<defs>' +
        '<linearGradient id="hg1" x1="0%" y1="0%" x2="100%" y2="100%">' +
        '<stop offset="0%" style="stop-color:#e06070;stop-opacity:0.85"/>' +
        '<stop offset="50%" style="stop-color:#d04060;stop-opacity:0.9"/>' +
        '<stop offset="100%" style="stop-color:#c03050;stop-opacity:0.85"/>' +
        '</linearGradient>' +
        '</defs>' +
        '<path d="M200 350 C200 350 30 240 30 140 C30 80 75 40 125 40 C160 40 185 60 200 85 C215 60 240 40 275 40 C325 40 370 80 370 140 C370 240 200 350 200 350Z" ' +
        'fill="url(#hg1)" stroke="rgba(232,185,48,0.4)" stroke-width="2"/>' +
        '</svg>';
      popup.appendChild(heartShape);

      /* Title */
      var titleEl = document.createElement('div');
      titleEl.className = 'heart-title';
      titleEl.textContent = UI[speechLang].popupTitle;
      popup.appendChild(titleEl);

      /* Greetings list */
      var list = document.createElement('ul');
      list.className = 'heart-greetings';
      var colors = ['var(--gold)', 'var(--lavender)', 'var(--sakura)', 'var(--rose)'];
      for (var j = 0; j < greetings.length; j++) {
        var li = document.createElement('li');
        var label = document.createElement('span');
        label.className = 'heart-greet-label';
        label.textContent = greetings[j].label;
        label.style.color = colors[j];
        var text = document.createElement('span');
        text.className = 'heart-greet-text';
        text.textContent = greetings[j].text;
        li.appendChild(label);
        li.appendChild(text);
        list.appendChild(li);
      }
      popup.appendChild(list);

      /* Progress bar */
      var progress = document.createElement('div');
      progress.className = 'heart-progress';
      var bar = document.createElement('div');
      bar.className = 'heart-progress-bar';
      progress.appendChild(bar);
      popup.appendChild(progress);

      overlay.appendChild(popup);
      document.body.appendChild(overlay);

      /* Remove existing cards and hide elements */
      for (var k = activeCards.length - 1; k >= 0; k--) {
        dismissCard(activeCards[k]);
      }

      /* Auto-dismiss after 5 seconds */
      setTimeout(function() {
        popup.classList.add('heart-exit');
        setTimeout(function() {
          if (overlay.parentNode) overlay.remove();
          heartPopupActive = false;
          heartClickCount = 0;
          startFireworks();
        }, 650);
      }, 5000);
    }

    /* ================================================================
       INTERACTION
       ================================================================ */
    function isInteractive(el) { return !!el.closest('button, nav, .blessing'); }
    function handleInteraction(x,y,target) { if(isInteractive(target)) return; showBlessing(x,y); requestAnimationFrame(function(){ spawnSparkles(x,y); }); }

    document.addEventListener('click', function(e){ handleInteraction(e.clientX,e.clientY,e.target); });
    document.addEventListener('click', function(e){
      if (heartPopupActive) return;
      heartClickCount++;
      if (heartClickCount >= HEART_CLICK_TRIGGER) {
        showHeartPopup();
      }
    });
    document.addEventListener('keydown', function(e){
      if((e.key==='Enter'||e.key===' ') && !isInteractive(e.target)) {
        e.preventDefault();
        var cx=window.innerWidth/2+(Math.random()-0.5)*160, cy=window.innerHeight/2+(Math.random()-0.5)*80;
        spawnSparkles(cx,cy); showBlessing(cx,cy);
      }
    });

  })();
  </script>
